name: heart_rate_web
description: "Use any Bluetooth heart-rate strap in the browser."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  ble_device_simulator: ^0.1.1
  ble_gatt_parser: ^0.1.1
  clock: ^1.1.2
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_web_bluetooth: ^1.2.0
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  xml: ^7.0.1

flutter:
  generate: true
  uses-material-design: true
